name: Tageslauf

on:
  schedule:
    - cron: "23 4 * * *"   # täglich 04:23 UTC (06:23 Uhr Sommerzeit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Git-Identität
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"

      - name: Indexierung prüfen und Drosselung bewerten
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python -m seo.cli monitor || true

      - name: Neue Seiten erzeugen und veröffentlichen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python -m seo.cli run
