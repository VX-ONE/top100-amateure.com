name: Statusbericht

on:
  schedule:
    - cron: "41 6 * * *"   # täglich 06:41 UTC (08:41 deutscher Zeit), nach Tageslauf und Video-Operator
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bericht erstellen
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python -m seo.cli status-report
      - name: Bericht und Prüfstände speichern
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add reports data/videos
          git diff --cached --quiet || git commit -m "Statusbericht $(date +%Y-%m-%d)"
          git pull --rebase -q && git push -q
      - name: Als GitHub-Issue zustellen (Benachrichtigung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y-%m-%d)
          gh label create statusbericht --color 0f766e --description "Täglicher Statusbericht" --force >/dev/null
          for n in $(gh issue list --label statusbericht --state open --json number --jq '.[].number'); do gh issue close "$n" >/dev/null; done
          gh issue create --title "Statusbericht $(date +%d.%m.%Y)" --label statusbericht --body-file "reports/${D}-status.md"
