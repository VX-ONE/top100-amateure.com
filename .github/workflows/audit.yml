name: Audit

# Zweiwöchentlicher Voll-Audit nach dem Masterprompt (Technik, Inhalte, Links, Affiliate, Performance, Sicherheit,
# Search Console). Läuft montags in geraden Kalenderwochen; Bericht als GitHub-Issue mit Label "audit".
on:
  schedule:
    - cron: "17 7 * * 1"   # montags 07:17 UTC (08:17/09:17 deutscher Zeit), nach Tageslauf, Videos und Statusbericht
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Nur in geraden Kalenderwochen (alle zwei Wochen)
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( 10#$(date +%V) % 2 )) -eq 0 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Ungerade Kalenderwoche – kein Audit."; echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten
        if: steps.due.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Seite bauen (aktueller Stand) und Audit ausführen
        if: steps.due.outputs.run == 'yes'
        timeout-minutes: 40
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m seo.cli build
          python -m seo.cli audit
      - name: Bericht speichern
        if: always() && steps.due.outputs.run == 'yes'
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add reports/*-audit.* reports/audit 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Audit $(date +%Y-%m-%d)"
          git pull --rebase -q -X theirs && git push -q
      - name: Als GitHub-Issue zustellen
        if: steps.due.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y-%m-%d)
          gh label create audit --color 7c3aed --description "Zweiwöchentlicher Voll-Audit" --force >/dev/null
          for n in $(gh issue list --label audit --state open --json number --jq '.[].number'); do gh issue close "$n" >/dev/null; done
          head -c 64000 "reports/${D}-audit.md" > /tmp/body.md
          gh issue create --title "Audit $(date +%d.%m.%Y)" --label audit --body-file /tmp/body.md
