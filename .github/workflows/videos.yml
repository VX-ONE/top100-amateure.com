name: Video-Operator

on:
  schedule:
    - cron: "17 5 * * 0,3"   # sonntags und mittwochs 05:17 UTC
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Nur Texte erzeugen (Videos nicht neu einlesen)"
        type: boolean
        default: false
      max:
        description: "Maximal so viele Videotexte erzeugen (leer = config)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: seo-daily          # nie gleichzeitig mit dem Tageslauf (gemeinsames Repo)
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - if: ${{ !inputs.skip_scrape }}
        run: python -m playwright install --with-deps chromium
      - name: Git-Identität
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
      - name: Neue Videos einlesen, Seiten erzeugen, veröffentlichen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP: ${{ inputs.skip_scrape && '--skip-scrape' || '' }}
          MAX: ${{ inputs.max && format('--max {0}', inputs.max) || '' }}
        run: python -m seo.cli videos $SKIP $MAX
