# ---------- Mengen und Qualität ----------
limits:
  daily_pages: 5                        # Start klein, erst erhöhen, wenn Seiten indexiert werden
  max_daily_pages: 30                   # harte Obergrenze, auch bei manueller Angabe
  max_attempts: 3                       # Generierungsversuche pro Seite
  min_words: 700
  max_similarity: 0.55                  # TF-IDF-Kosinus zu bestehenden Seiten, darüber wird nicht veröffentlicht
