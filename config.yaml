# ---------- Mengen und Qualität ----------
limits:
  daily_pages: 5                        # Start klein, erst erhöhen, wenn Seiten indexiert werden
  topic_pages: false                    # neue Ratgeber-/Themenartikel pausiert (Chris 27.10.2026: Fokus Model- und Videoseiten)
  max_daily_pages: 30                   # harte Obergrenze, auch bei manueller Angabe
  refresh_per_run: 10          # Seiten aus data/refresh.txt, die pro Lauf neu geschrieben werden
  max_minutes: 80             # Zeitbremse pro Lauf (Workflow-Timeout ist 120 Minuten)
  max_attempts: 3                       # Generierungsversuche pro Seite
  min_words: 700
  max_similarity: 0.55                  # TF-IDF-Kosinus zu bestehenden Seiten, darüber wird nicht veröffentlicht
  min_sections: 4
  min_faq: 3

paths:
  data: data
  site: site
  reports: reports

llm:
  model: "claude-sonnet-5-5"            # Artikelgenerierung
  screen_model: "claude-haiku-5-5"      # schnelle Vorprüfung der Keywords
  max_tokens: 9000

keywords:
  min_tokens: 2
  max_tokens: 7
  cluster_similarity: 0.6               # Keywords mit ähnlichen Wörtern landen auf derselben Seite
  # Keyword-Kreislauf: der Tageslauf übernimmt neue Suchanfragen aus der Search Console.
  # Sie durchlaufen dieselben Filter wie jeder Import (Wortliste, Sperrliste, KI-Vorprüfung).
  # Reihenfolge der Warteschlange: Zusatzpunkte für Seiten mit Kaufabsicht (Marke + Frage) und für Österreich/Schweiz.
  priority:
    brand: 400000
    dach: 0                     # 21.10.: je Land 4 Seiten vorhanden, weitere würden kannibalisieren
    topics:
      livecams: 60000
      webcam-models: 60000
      videos: 60000
      amateure: 60000
      nischen: -150000            # allgemeine Nischen ranken kaum gegen Tube-Seiten: nach hinten
  harvest:
    enabled: true
    days: 28
    min_impressions: 1
    max_queries: 500

# ---------- Überwachung ----------
monitor:
  grace_days: 14                        # Seiten müssen so alt sein, bevor sie bewertet werden
  min_indexed_ratio: 0.30               # darunter wird die Tagesmenge gedrosselt
  min_sample: 10
  min_topic_ratio: 0.20                 # darunter wird ein Themen-Cluster pausiert
  min_topic_sample: 4
  throttle_to: 1                        # Seiten pro Tag bei aktiver Drosselung
  # Wächst die Indexierungsquote (>= min_ratio bei genug reifen Seiten), steigt die Tagesmenge alle every_days Tage um step
  # bis max_daily_pages. Bei Drosselung wächst nichts.
  ramp:
    enabled: true
    min_ratio: 0.6
    every_days: 7
    step: 5

# ---------- Optimierer ----------
# Wertet täglich Position, Klickrate und Suchanfragen je Seite aus und verbessert Seiten mit Potenzial.
# Jede Änderung geht durch das Qualitäts-Gate, die alte Fassung liegt in data/history/, und nach effect_days
# wird sie zurückgerollt, falls die Position deutlich schlechter wurde.
optimize:
  enabled: true
  min_age_days: 21          # Seiten müssen so alt sein, bevor sie angefasst werden
  cooldown_days: 28         # Pause je Seite nach einer Änderung
  max_per_run: 3            # höchstens so viele Seiten pro Tag
  min_impressions: 30
  striking_min: 8           # Position 8 bis 30: Inhalte ergänzen
  striking_max: 30
  ctr_floor: 0.015          # Position <= 10 und Klickrate darunter: Titel überarbeiten
  no_traction_days: 60      # indexiert, aber ohne Impressionen: einmal neu schreiben
  effect_days: 21
  rollback_drop: 4          # Position um so viele Plätze schlechter: zurückrollen

